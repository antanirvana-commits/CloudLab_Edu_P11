name: CloudLab Edu CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-test:
    name: Backend Automated Test
    runs-on: ubuntu-latest

    env:
      DEMO_ADMIN_PASSWORD: Admin@123
      DEMO_DOSEN_PASSWORD: Dosen@123
      DEMO_MAHASISWA_PASSWORD: Mhs@12345
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare test environment
        run: |
          cp .env.example .env

      - name: Run automated tests
        run: |
          python -m pytest -q

  container-build:
    name: Build Docker Containers
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: cloudlab-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: cloudlab-frontend:ci

      - name: Verify Docker images
        run: |
          docker image inspect cloudlab-backend:ci
          docker image inspect cloudlab-frontend:ci

  staging-smoke:
    name: Staging Smoke Test
    runs-on: ubuntu-latest
    needs: container-build

    env:
      DEMO_ADMIN_PASSWORD: Admin@123
      DEMO_DOSEN_PASSWORD: Dosen@123
      DEMO_MAHASISWA_PASSWORD: Mhs@12345

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare staging environment
        run: |
          if [ -f deploy/staging/.env.staging.example ]; then
            cp deploy/staging/.env.staging.example deploy/staging/.env.staging
          fi

      - name: Start staging services
        run: |
          docker compose \
            -f docker-compose.yml \
            -f deploy/staging/docker-compose.staging.yml \
            up -d --build

      - name: Show container status
        run: |
          docker compose \
            -f docker-compose.yml \
            -f deploy/staging/docker-compose.staging.yml \
            ps

      - name: Wait for backend health check
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              echo "Backend is healthy."
              exit 0
            fi
            echo "Waiting for backend... attempt $i/30"
            sleep 5
          done

          echo "Backend did not become healthy."
          docker compose \
            -f docker-compose.yml \
            -f deploy/staging/docker-compose.staging.yml \
            logs backend
          exit 1

      - name: Test frontend
        run: |
          curl --fail --silent --show-error http://localhost:8080/public/login.html > /dev/null
          echo "Frontend smoke test passed."

      - name: Test backend version
        run: |
          curl --fail --silent --show-error http://localhost:8000/version
          echo

      - name: Show final container status
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f deploy/staging/docker-compose.staging.yml \
            ps

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f deploy/staging/docker-compose.staging.yml \
            logs --no-color

      - name: Stop staging services
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f deploy/staging/docker-compose.staging.yml \
            down -v
