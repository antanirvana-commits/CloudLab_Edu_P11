name: CloudLab Edu CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare test environment
        run: cp .env.example .env
      - name: Run automated tests
        run: pytest -q

  container-build:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t cloudlab-backend:${{ github.sha }} ./backend
      - name: Build frontend image
        run: docker build -t cloudlab-frontend:${{ github.sha }} ./frontend

  staging-smoke:
    runs-on: ubuntu-latest
    needs: container-build
    steps:
      - uses: actions/checkout@v4
      - name: Start temporary staging stack
        run: docker compose -f deploy/staging/docker-compose.staging.yml up -d --build
      - name: Wait and check health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/health; then exit 0; fi
            sleep 3
          done
          docker compose -f deploy/staging/docker-compose.staging.yml ps
          docker compose -f deploy/staging/docker-compose.staging.yml logs backend
          exit 1
      - name: Stop staging stack
        if: always()
        run: docker compose -f deploy/staging/docker-compose.staging.yml down -v
