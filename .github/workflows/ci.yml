name: CloudLab Edu CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-test:
    name: Backend Automated Test
    runs-on: ubuntu-latest

    env:
      DEMO_ADMIN_PASSWORD: Admin@123
      DEMO_DOSEN_PASSWORD: Dosen@123
      DEMO_MAHASISWA_PASSWORD: Mhs@12345
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare test environment
        run: |
          cp .env.example .env

      - name: Run automated tests
        run: |
          python -m pytest -q

  container-build:
    name: Build Docker Containers
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build -t cloudlab-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: |
          docker build -t cloudlab-frontend:${{ github.sha }} ./frontend

  staging-smoke:
    name: Staging Smoke Test
    runs-on: ubuntu-latest
    needs: container-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate staging compose
        run: |
          docker compose             -f deploy/staging/docker-compose.staging.yml             config

      - name: Start staging services
        run: |
          docker compose             --env-file deploy/staging/.env.staging.example             -f deploy/staging/docker-compose.staging.yml             up -d --build

      - name: Show staging containers
        run: |
          docker compose             --env-file deploy/staging/.env.staging.example             -f deploy/staging/docker-compose.staging.yml             ps

      - name: Wait for backend health
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              echo "Backend staging is healthy."
              exit 0
            fi

            echo "Waiting for backend staging... attempt $i/30"
            sleep 5
          done

          echo "Backend staging did not become healthy."
          docker compose             --env-file deploy/staging/.env.staging.example             -f deploy/staging/docker-compose.staging.yml             ps

          docker compose             --env-file deploy/staging/.env.staging.example             -f deploy/staging/docker-compose.staging.yml             logs --no-color backend

          exit 1

      - name: Test frontend staging
        run: |
          curl --fail --silent --show-error             http://localhost:8080/public/login.html             > /dev/null

          echo "Frontend staging is reachable."

      - name: Test backend version
        run: |
          curl --fail --silent --show-error             http://localhost:8000/version
          echo

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose             --env-file deploy/staging/.env.staging.example             -f deploy/staging/docker-compose.staging.yml             ps

          docker compose             --env-file deploy/staging/.env.staging.example             -f deploy/staging/docker-compose.staging.yml             logs --no-color

      - name: Stop staging services
        if: always()
        run: |
          docker compose             --env-file deploy/staging/.env.staging.example             -f deploy/staging/docker-compose.staging.yml             down -v
