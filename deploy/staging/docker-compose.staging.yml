services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: practicum_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d practicum_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - cloudlab_staging_pgdata:/var/lib/postgresql/data

  backend:
    build: ../../backend
    environment:
      APP_NAME: CloudLab Edu
      APP_ENV: staging
      APP_VERSION: ${APP_VERSION:-1.2.0}
      APP_SECRET: ${APP_SECRET:-staging-demo-secret}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin@123}
      DEMO_DOSEN_PASSWORD: ${DEMO_DOSEN_PASSWORD:-Dosen@123}
      DEMO_MAHASISWA_PASSWORD: ${DEMO_MAHASISWA_PASSWORD:-Mhs@12345}
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/practicum_db
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      SIMULATE_HEALTH_FAILURE: ${SIMULATE_HEALTH_FAILURE:-false}
      ENABLE_FAILURE_DEMO: ${ENABLE_FAILURE_DEMO:-true}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ../../frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  cloudlab_staging_pgdata:
