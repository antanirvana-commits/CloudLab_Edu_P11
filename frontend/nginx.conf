server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index public/login.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /health { proxy_pass http://backend:8000/health; }
    location = /version { proxy_pass http://backend:8000/version; }
    location /docs { proxy_pass http://backend:8000/docs$is_args$args; }
    location /openapi.json { proxy_pass http://backend:8000/openapi.json$is_args$args; }
    location /static/ { try_files $uri =404; }
    location = / { return 302 /public/login.html; }
    location / { try_files $uri $uri/ /public/login.html; }
}
